<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harbor Lights Bakery</title>
  </head>
  <body>
    <!--
      A business's own website, for the web chat end-to-end test (webchat.spec.ts). The
      test server fills in the CRM's address and the widget key, and serves this page
      with a strict Content-Security-Policy: scripts and connections only to the CRM, no
      inline script and no inline style. So the page has neither; what it tests instead
      is that the widget needs neither.
    -->
    <main>
      <h1>Harbor Lights Bakery</h1>
      <p>Fresh bread every morning. Ask us anything in the chat.</p>
      <p><a href="#menu">See the menu</a></p>
      <form>
        <label>Search the site <input type="search" name="q" /></label>
        <button type="button">Search</button>
      </form>
    </main>
    <!-- The one line a business pastes. -->
    <script async src="{{CRM}}/webchat/widget.js" data-widget-key="{{KEY}}"></script>
  </body>
</html>
