# One version of the Node.js types everywhere, matching the Node line we run. Packages
# that accept any version would otherwise each pull in a different one.
overrides:
  '@types/node': 'catalog:'
  # Stryker's typed-rest-client accepts this patched qs release (GHSA-x5fp-wj9c-mxmx).
  'typed-rest-client>qs': 6.16.0

# Dependencies may only run install scripts when listed here; anything else fails the
# install (strictDepBuilds). lefthook's postinstall installs the git hooks.
allowBuilds:
  lefthook: true
  # Testcontainers reaches Docker through dockerode, which pulls these in. ssh2 and
  # cpu-features only try to compile optional native bindings (ssh2 falls back to
  # JavaScript), and protobufjs's postinstall only prints a version warning.
  cpu-features: false
  protobufjs: false
  ssh2: false

# Nothing published less than a day ago is installed (most malicious releases are pulled
# within hours). Set explicitly, so pnpm fails instead of quietly installing a newer
# version or adding an exception, as its built-in default does.
minimumReleaseAge: 1440
patchedDependencies:
  testcontainers@12.2.0: patches/testcontainers@12.2.0.patch
