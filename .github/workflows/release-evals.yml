name: Release evals

# The eval gate in the strength a release asks for: every model the
# product calls Tested is still shown to pass its job's suite, from its recorded run, and
# the default model of every job that has a suite is Tested.
#
# It calls no model, needs no key and no secret, and reaches no network once it is
# installed: a Tested model is checked by playing its run report back (evals/README.md).
# The run that does call a model is made by hand, with the owner's own key and a budget.
#
# Never on main or on pull requests: there the same gate, without --release, already runs
# inside the AI module's unit tests in ci.yml at no extra job. This job costs nothing until
# a release branch or a version tag exists.
on:
  push:
    branches: ['release/**']
    tags: ['v*']
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: release-evals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # About a minute when all is well; a stuck install is cut off.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The cache ci.yml's check job saves on main, read and never written here, so this
      # job adds nothing to the account's cache storage. With it, the build below is
      # mostly restored instead of run.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-check-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-check-${{ runner.os }}-

      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      # .nvmrc pins the exact version developers run, so CI and local runs agree.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install
        run: pnpm install --frozen-lockfile

      # Only the AI module and the packages it is built on: turbo runs their builds first.
      - name: Build the AI module
        run: pnpm turbo run build --filter=@repo/module-ai

      - name: Eval gate
        run: pnpm --filter @repo/module-ai evals -- gate --release
