name: Permission and outbound policy mutation tests

on:
  workflow_dispatch:
  schedule:
    # Monday at 05:30 UTC (08:30 Nairobi), following the owner's Actions budget decision.
    - cron: '30 5 * * 1'

permissions:
  contents: read

concurrency:
  group: permissions-mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm --filter @repo/contracts run test:mutation
      - run: pnpm --filter @repo/commands run test:mutation
      - run: pnpm --filter @repo/module-messaging run test:mutation
