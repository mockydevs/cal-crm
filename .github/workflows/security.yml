name: Security

on:
  # Only a change to what's installed brings a vulnerability in. CI scans every pull
  # request's and push's commits for secrets (its changes job).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'osv-scanner.toml'
      - '.github/workflows/security.yml'
  push:
    branches: [main]
    paths:
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'osv-scanner.toml'
      - '.github/workflows/security.yml'
  # New vulnerabilities are published for code that hasn't changed.
  schedule:
    - cron: '0 5 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # The whole history each week, with the newest rules: on a schedule, gitleaks-action
  # scans every commit. Pull requests and pushes are scanned in CI.
  secrets:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings go to the job summary; commenting would need write access.
          GITLEAKS_ENABLE_COMMENTS: false

  # Pull requests fail only on vulnerabilities they introduce. Results stay in the
  # run: uploading to code scanning needs GitHub Advanced Security on a private repo.
  vulnerabilities-in-pull-request:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      upload-sarif: false

  vulnerabilities:
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      upload-sarif: false
